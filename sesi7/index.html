<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Entry Form</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-12 px-4 sm:px-6 lg:px-8">

    <div class="max-w-2xl mx-auto space-y-8">
        
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-extrabold text-white sm:text-4xl">Add New Product</h1>
            <p class="text-slate-400 text-sm">Enter the product details below to send to process.php</p>
        </div>

        <form action="process.php" method="POST" class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-6 sm:p-8 shadow-2xl backdrop-blur-sm space-y-6">
            
            <!-- 1. Product Name -->
            <div>
                <label for="name" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">
                    Product Name <span class="text-rose-400">*</span>
                </label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    placeholder="e.g. Wireless Headphones"
                    class="w-full px-4 py-2.5 bg-slate-900/90 border border-slate-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none transition-all"
                    required
                >
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- 2. Category -->
                <div>
                    <label for="category" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">
                        Category <span class="text-rose-400">*</span>
                    </label>
                    <select 
                        id="category" 
                        name="category" 
                        class="w-full px-4 py-2.5 bg-slate-900/90 border border-slate-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 rounded-xl text-white text-sm focus:outline-none transition-all"
                        required
                    >
                        <option value="" disabled selected>Select Category</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Clothing">Clothing & Apparel</option>
                        <option value="Home & Kitchen">Home & Kitchen</option>
                        <option value="Books">Books & Media</option>
                    </select>
                </div>

                <!-- 3. Price -->
                <div>
                    <label for="price" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">
                        Price ($ USD) <span class="text-rose-400">*</span>
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 text-sm">$</span>
                        <input 
                            type="number" 
                            step="0.01" 
                            id="price" 
                            name="price" 
                            placeholder="99.99"
                            class="w-full pl-8 pr-4 py-2.5 bg-slate-900/90 border border-slate-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none transition-all"
                            required
                        >
                    </div>
                </div>
            </div>

            <!-- 4. Description -->
            <div>
                <label for="description" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">
                    Product Description <span class="text-rose-400">*</span>
                </label>
                <textarea 
                    id="description" 
                    name="description" 
                    rows="4" 
                    placeholder="Enter product description..."
                    class="w-full px-4 py-2.5 bg-slate-900/90 border border-slate-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none transition-all"
                    required
                ></textarea>
            </div>

            <!-- Submit Button -->
            <button 
                type="submit" 
                class="w-full py-3.5 px-6 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-500/25 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all duration-200 cursor-pointer"
            >
                Submit Product
            </button>
        </form>

    </div>

</body>
</html>
